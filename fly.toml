# fly.toml app configuration file generated for gaynam-ai-portal on 2026-10-28T21:59:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gaynam-ai-portal'
primary_region = 'bom'

[build]

[env]
  GYANAM_UPLOAD_DIR = '/app/data/uploads'
  PORT = '8090'

[[mounts]]
  source = 'gyanam_data'
  destination = '/app/data'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[checks]
  [checks.health]
    port = 8090
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/status'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
