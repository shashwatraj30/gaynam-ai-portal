[pytest]
# Run from the repo root:  python -m pytest -c tests/e2e/pytest.ini tests/e2e --e2e-browsers=chromium
# (own config so the backend-level tests/conftest.py is not loaded)
testpaths = .
addopts = -q -ra
markers =
    visual: screenshot regression
    a11y: axe-core scans
    perf: performance budget
