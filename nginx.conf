server {
    listen 80;
    server_name localhost;

    # Maximum client upload size for legal briefs (up to 64MB)
    client_max_body_size 64M;

    # Gzip compression for high-speed transmission
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Reverse proxy to Vidhi AI ASGI backend
    location / {
        proxy_pass http://vidhi-backend:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Never let clients bypass auth with the legacy shim header
        proxy_set_header X-Gyanam-Legacy "";
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
    }
}
