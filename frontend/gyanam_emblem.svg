<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <defs>
    <!-- Rich 24K Gold Gradients -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D1"/>
      <stop offset="25%" stop-color="#F3C64F"/>
      <stop offset="50%" stop-color="#C8962E"/>
      <stop offset="75%" stop-color="#FDE08B"/>
      <stop offset="100%" stop-color="#9A6B17"/>
    </linearGradient>

    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="40%" stop-color="#D4AC0D"/>
      <stop offset="70%" stop-color="#7D6608"/>
      <stop offset="100%" stop-color="#F7DC6F"/>
    </linearGradient>

    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F244A"/>
      <stop offset="65%" stop-color="#07142A"/>
      <stop offset="100%" stop-color="#030914"/>
    </radialGradient>

    <radialGradient id="flameGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FFB300" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#FF6F00" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Medallion -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="url(#goldGrad1)" stroke-width="4"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#goldGrad2)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.8"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad1)" stroke-width="1" opacity="0.5"/>

  <!-- Subtle Sunburst rays in background -->
  <g stroke="url(#goldGrad1)" stroke-width="0.75" opacity="0.25">
    <line x1="100" y1="16" x2="100" y2="30"/>
    <line x1="100" y1="170" x2="100" y2="184"/>
    <line x1="16" y1="100" x2="30" y2="100"/>
    <line x1="170" y1="100" x2="184" y2="100"/>
    <line x1="41" y1="41" x2="51" y2="51"/>
    <line x1="149" y1="149" x2="159" y2="159"/>
    <line x1="159" y1="41" x2="149" y2="51"/>
    <line x1="41" y1="159" x2="51" y2="149"/>
  </g>

  <!-- Luminous Aura around Flame -->
  <circle cx="100" cy="78" r="34" fill="url(#flameGlow)"/>

  <!-- Gyanam Sacred Flame (Jyoti of Wisdom) -->
  <!-- Outer flame layer -->
  <path d="M100 42 C107 58 116 70 113 88 C110 102 90 102 87 88 C84 70 93 58 100 42 Z" 
        fill="url(#goldGrad1)" filter="url(#glow)"/>
  <!-- Inner brilliant flame core -->
  <path d="M100 52 C103 64 109 74 107 85 C105 93 95 93 93 85 C91 74 97 64 100 52 Z" 
        fill="#FFF9E6"/>

  <!-- Classical Pillar / Base of Diya -->
  <path d="M88 96 L112 96 L108 108 L92 108 Z" fill="url(#goldGrad1)"/>
  <rect x="84" y="108" width="32" height="4" rx="1.5" fill="url(#goldGrad2)"/>

  <!-- Balanced Scales of Justice (Nyaya Tula) -->
  <!-- Main Beam -->
  <path d="M48 88 L152 88" stroke="url(#goldGrad1)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Central Pivot Point / AI Diamond -->
  <circle cx="100" cy="88" r="4" fill="#FFF9E6" stroke="url(#goldGrad2)" stroke-width="1.5"/>
  
  <!-- Left Balance Pan & Cords -->
  <path d="M54 88 L40 120 M54 88 L68 120" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.85"/>
  <path d="M34 120 C34 130 74 130 74 120 Z" fill="url(#goldGrad1)" stroke="url(#goldGrad2)" stroke-width="1"/>
  
  <!-- Right Balance Pan & Cords -->
  <path d="M146 88 L132 120 M146 88 L160 120" stroke="url(#goldGrad2)" stroke-width="1.2" opacity="0.85"/>
  <path d="M126 120 C126 130 166 130 166 120 Z" fill="url(#goldGrad1)" stroke="url(#goldGrad2)" stroke-width="1"/>

  <!-- Apex: 8-Pointed Celestial Star of Justice & AI -->
  <g transform="translate(100, 32)" fill="url(#goldGrad1)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Sanskrit Script Arch: ज्ञानम् -->
  <text x="100" y="152" text-anchor="middle" fill="url(#goldGrad1)" 
        font-family="'Cinzel', 'Noto Serif Devanagari', 'Georgia', serif" 
        font-size="14" font-weight="900" letter-spacing="4">
    ज्ञानम्
  </text>
  
  <!-- Sub-inscription: AI JURISPRUDENCE -->
  <text x="100" y="166" text-anchor="middle" fill="#E2E8F0" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="6.5" font-weight="800" letter-spacing="2" opacity="0.85">
    JUDICIAL INTELLIGENCE
  </text>
</svg>