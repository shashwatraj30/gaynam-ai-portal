name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests
      - run: pytest
        env:
          GEMINI_API_KEY: ""
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test frontend/app/tests/*.test.js
  e2e:
    # Playwright for Python, chromium only on every PR; the full browser matrix runs nightly (e2e-nightly.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt playwright pillow
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -c tests/e2e/pytest.ini tests/e2e --e2e-browsers=chromium
        env:
          GEMINI_API_KEY: ""
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: tests/e2e/.artifacts
          if-no-files-found: ignore
