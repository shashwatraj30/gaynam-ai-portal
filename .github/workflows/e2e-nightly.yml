name: e2e-nightly
on:
  schedule:
    - cron: "0 21 * * *"   # 02:30 IST
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Regenerate visual baselines for linux and upload them as an artifact (commit them from there)"
        type: boolean
        default: false
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt "playwright>=1.45" pillow
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - name: e2e (${{ matrix.browser }})
        run: >
          python -m pytest -c tests/e2e/pytest.ini --e2e-browsers=${{ matrix.browser }}
          ${{ inputs.update_baselines && '--update-baselines' || '' }}
        env:
          GEMINI_API_KEY: ""
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            tests/e2e/.artifacts
            tests/e2e/baselines/${{ matrix.browser }}-linux
          if-no-files-found: ignore
